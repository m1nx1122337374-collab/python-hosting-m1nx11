<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1NX VIP BOT SERVER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px); border-radius: 20px; padding: 40px; border: 1px solid rgba(255, 255, 255, 0.18); text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); max-width: 500px; width: 90%; }
        h1 { font-size: 2.2rem; color: #00f2fe; margin-bottom: 10px; text-shadow: 0 0 10px rgba(0, 242, 254, 0.5); }
        p { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 25px; line-height: 1.6; }
        .status { display: inline-block; padding: 8px 18px; border-radius: 50px; background: rgba(76, 175, 80, 0.2); color: #4CAF50; border: 1px solid #4CAF50; font-weight: bold; font-size: 0.9rem; }
        .footer { margin-top: 25px; font-size: 0.8rem; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 M1NX VIP SERVER</h1>
        <p>Welcome to our Automated Bot System! The server is running smoothly 24/7 with active monitoring.</p>
        <div class="status">● SERVER ONLINE</div>
        <div class="footer">Powered by Python & Render Host</div>
    </div>
</body>
</html>
